<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tarkie UI Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --tarkie-bg: #f4f6f9;
            --tarkie-sidebar-bg: #ffffff;
            --tarkie-sidebar-border: #e2e8f0;
            --tarkie-sidebar-text: #475569;
            --tarkie-sidebar-hover: #f1f5f9;
            --tarkie-sidebar-active-bg: #eff6ff;
            --tarkie-sidebar-active-text: #2563eb;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --border-color: #e2e8f0;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tarkie-bg);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        h2, h3, h4 { color: var(--text-main); font-weight: 700; }
        
        button {
            padding: 9px 16px;
            background-color: var(--primary);
            border: none;
            color: white;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }

        .dashboard-layout {
            display: block;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background: var(--tarkie-sidebar-bg);
            border-right: 1px solid var(--tarkie-sidebar-border);
            position: fixed;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--tarkie-sidebar-border);
        }

        .sidebar-brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .sidebar-brand {
            width: 32px;
            height: 32px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .sidebar-brand-text {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .sidebar-menu-scroll {
            overflow-y: auto;
            flex-grow: 1;
            padding: 12px 10px;
        }

        .sidebar-category-title {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 8px 10px 4px 10px;
            margin-top: 8px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-menu li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--tarkie-sidebar-text);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .sidebar-menu li:hover {
            background: var(--tarkie-sidebar-hover);
            color: var(--text-main);
        }

        .sidebar-menu li.active {
            background: var(--tarkie-sidebar-active-bg);
            color: var(--tarkie-sidebar-active-text);
            font-weight: 600;
        }

        .sidebar-icon { font-size: 15px; display: flex; align-items: center; justify-content: center; width: 20px; }

        .main-content {
            margin-left: 240px;
            padding: 24px;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .header-bar {
            background: var(--card-bg);
            padding: 14px 20px;
            border-radius: var(--radius-md);
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .content-section {
            display: none;
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.03);
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }
        .content-section.active { display: block; }

        .logout-btn {
            background-color: #ffeeee;
            color: #dc2626;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .logout-btn:hover { background-color: #dc2626; color: white; }

        .task-table-container { overflow-x: auto; margin-top: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
        .task-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
            background: #fff;
        }
        .task-table th, .task-table td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 10px;
            vertical-align: middle;
        }
        .task-table th:last-child, .task-table td:last-child { border-right: none; }
        .task-table th { background-color: #f8fafc; color: var(--text-main); font-weight: 600; }
    </style>
</head>
<body>

    <!-- Dashboard Layout -->
    <div class="dashboard-layout" id="dashboardLayout">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand-container">
                    <div class="sidebar-brand">AD</div>
                    <div class="sidebar-brand-text">Admin Panel</div>
                </div>
            </div>
            <div class="sidebar-menu-scroll">
                <div class="sidebar-category-title">Management</div>
                <ul class="sidebar-menu">
                    <li class="active" onclick="switchTab(event, 'dashboardTab')">
                        <span class="sidebar-icon">📊</span>
                        <span>Overview & Users</span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="main-content">
            <div class="header-bar">
                <div>
                    <h3 id="dashTitle" style="margin:0; font-size: 16px;">Welcome, Admin</h3>
                    <p style="margin: 2px 0 0 0; font-size: 12px; color: var(--text-muted);">Role: <span id="dashRole" style="font-weight:600; color:var(--text-main);">Admin / Report Analyst Team Lead</span></p>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Log out</button>
            </div>

            <!-- DASHBOARD TAB -->
            <div id="dashboardTab" class="content-section active">
                <h3 style="margin-top:0; font-size: 15px;">Admin Control Center</h3>
                <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 20px;">Dito mo makikita ang pangkalahatang ulat at sistema.</p>
                
                <div class="task-table-container">
                    <table class="task-table">
                        <thead>
                            <tr>
                                <th>Pangalan ng User</th>
                                <th>Role</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Jayvie A. Condeno</td>
                                <td>Admin / Report Analyst Team Lead</td>
                                <td><span style="color: var(--success); font-weight: 600;">Active</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Diretso nang nagloload ang dashboard nang walang login check
        };

        function handleLogout() {
            localStorage.clear();
            // Pagka-log out, direktang lilipat sa ST.html
            window.location.href = 'ST.html';
        }

        function switchTab(evt, tabId) {
            let sections = document.getElementsByClassName('content-section');
            for (let sec of sections) sec.classList.remove('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
